<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clean Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #3a3a5a);
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            font-size: 24px;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card h1 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            opacity: 0.8;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #ff7a18;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff9a3c;
        }
    </style>
</head>
<body>

<header>
    My Cool Website
</header>

<div class="container">
    <div class="card">
        <h1>Hello 👋</h1>
        <p>This is a clean and simple modern design.</p>
        <button class="btn">Click Me</button>
    </div>
</div>

</body>
</html>
