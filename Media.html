    <title>Media</title>

    <body>
        <h2>How to add Media into an HTML.</h2>
        <center>
            <img src="Image.jpg" alt="BOO!" width="500" height="300">
        </center>
        <h2>How to add Video into an HTML.</h2>
        <center>
            <video width="500" height="300" controls>

                Your browser does not support the video tag.
            </video>
        </center>

    </body>
