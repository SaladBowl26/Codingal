<html>
    <body>

        <h2>JavaScript Objects and Its Properties</h2>

        <p>There are two different ways to access an object properties</p>

        <p>You can use .property or ["property"]</p>
        <p id="demo"></p>
        <script>
            var person = {
                firstName: "Six",
                lastName: "Seven",
                age: 67,
            };
            document.getElementById("demo").innerHTML = person.firstName + " am " + person.lastName + " is " + person.age + " years old.";
        </script>
    </body>
    </html>
