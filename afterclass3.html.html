<!DOCTYPE html>
<html>
<head>
    <title>Tables V2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }

        h3 {
            color: #333;
        }

        a {
            display: inline-block;
            padding: 8px 12px;
            background-color: #ff4c4c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background-color: #e63e3e;
        }

        table {
            border-collapse: collapse;
            width: 50%;
            background-color: white;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border: 2px solid #444;
        }

        th {
            background-color: #333;
            color: white;
        }

        ol, ul {
            margin-left: 20px;
        }
    </style>
</head>

<body>

    <h3>How to add links</h3>
    <p>Click this... trust me 👀</p>

    <a href="https://www.youtube.com/watch?v=xvFZjo5PgG0" target="_blank">
        Visit YouTube Now!!
    </a>

    <h3>Tables list</h3>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Shravan Vivek</td>
            <td>14</td>
            <td>Kerala</td>
        </tr>
        <tr>
            <td>Fransisco</td>
            <td>67</td>
            <td>Mexico</td>
        </tr>
    </table>

    <h3>Ordered list</h3>

    <ol>
        <li>SixSeven!!!!</li>
        <li>Pencil</li>
        <li>LunchBox</li>
    </ol>

    <h3>Unordered list</h3>

    <ul>
        <li>Bag</li>
        <li>Books</li>
        <li>Pen</li>
    </ul>

</body>
</html>
