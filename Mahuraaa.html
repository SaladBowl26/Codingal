<html>
    <body>

        <p>Finding the largest number with the help of Argument Objects</p>
        <p id="result"></p>
        <script>
            function findMax() {
                var i;
                var max = 0;
                for(i = 0; i < arguments.length; i++) {
                    if(arguments[i] > max) {
                        max = arguments[i];
                    }
                }
                document.getElementById("result").innerHTML = "The largest number is: " + max;
            }
            findMax(4,5,6,7);
        </script>
    </body>
</html>
