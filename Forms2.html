<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Forms2.0</title>
        <link href="style.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <h1>Personal Information Form</h1>
        <form>
            <label>Name</label><br>
            <input type="text" name="name"><br><br>
            <label>Email</label><br>
            <input type="email" name="email"><br><br>
            <label>Contact Number (Will be hidden)</label><br>
            <input type="password" id="Contact"><br><br>
            <label>Gender</label><br>
            <input type="radio" name="gender" value="male"> Male<br>
            <input type="radio" name="gender" value="female">Female<br><br>
            <label>Favourate Cities</label><br>
            <input type="checkbox" name="cities" value="New York"> New York<br>
            <input type="checkbox" name="cities" value="London"> London<br>
            <input type="checkbox" name="cities" value="Tokyo"> Tokyo<br><br>
            <button type="button" onclick="alert('Form Submitted!')">Submit!</button>
        </form>

<button onclick="document.getElementById('sound').play()">Play Sound</button>

<audio id="sound">
  <source src="hehe.mp3" type="audio/mpeg">
</audio>
    </body>
</html>
